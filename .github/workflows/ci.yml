name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# 最小权限：工作流只需要读仓库
permissions:
  contents: read

# 同一 ref 的连续 push 只保留最新一次运行，省 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "needs gofmt:"; echo "$out"; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -count=1 -race -timeout 500s ./...

      - name: make release(5 平台交叉编译)
        run: make release

      - name: smoke(产物可执行)
        run: ./dist/minirepo-linux-amd64 version

  # 打 v* tag 且 test 绿 → 自动创建 Release 并挂上 5 平台产物
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 创建 Release + 上传附件(仅此 job 需要写)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: make release(5 平台交叉编译)
        run: make release

      - name: SHA256SUMS
        run: cd dist && sha256sum minirepo-* > SHA256SUMS.txt

      - name: 创建 Release 并上传产物(幂等:已存在则复用、附件覆盖)
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
